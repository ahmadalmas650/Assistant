# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating mode.
# This enables experimental features.
#org.gradle.incubating=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.daemon=true

# AndroidX package structure to make it clearer what code is being used.
# For more information: go.microsoft.com/fwlink/?linkid=874877
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Kotlin code style for this project: "official" or "obsolete":
#kotlin.code.style=official

# Enable Gradle's new configuration caching mechanism.
# More info: https://docs.gradle.org/8.1/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# Enable Gradle's new build cache mechanism.
# More info: https://docs.gradle.org/8.1/userguide/build_cache.html
org.gradle.caching=true
